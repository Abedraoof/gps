<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c14">
<title>RUNTRACK PRO V6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg-dark: #080c14;
  --card-bg: #101726;
  --card-border: #1e293b;
  --accent-green: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.25);
  --accent-warn: #f59e0b;
  --accent-danger: #ef4444;
  --text-main: #f8fafc;
  --text-muted: #64748b;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:var(--bg-dark);color:var(--text-main);font-family:system-ui,-apple-system,sans-serif;padding:12px;direction:rtl}
.app{max-width:850px;margin:auto;display:flex;flex-direction:column;gap:10px}

header{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.logo{font-size:20px;font-weight:900;letter-spacing:-0.5px;display:flex;align-items:center;gap:6px}
.logo span{color:var(--accent-green)}
.gps-pill{font-size:11px;font-weight:700;display:flex;align-items:center;gap:8px;background:#131c2e;padding:6px 12px;border-radius:20px;border:1px solid var(--card-border)}
.dot{width:8px;height:8px;border-radius:50%;background:#475569;transition:all 0.3s}
.dot.good{background:var(--accent-green);box-shadow:0 0 10px var(--accent-green)}
.dot.warn{background:var(--accent-warn)}
.dot.bad{background:var(--accent-danger)}

.hero{background:linear-gradient(160deg,#131d30,#0b121e);border:1px solid var(--card-border);border-radius:24px;padding:20px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 60%);pointer-events:none}
.state{font-size:11px;color:var(--text-muted);font-weight:800;letter-spacing:1px}
.time{font-size:48px;font-weight:900;letter-spacing:-1px;margin:4px 0;font-variant-numeric:tabular-nums}
.dist{font-size:68px;line-height:1;font-weight:900;letter-spacing:-2px;color:#fff}
.dist small{font-size:16px;color:var(--text-muted);margin-right:4px}
.pace-box{margin-top:10px;font-size:12px;color:var(--text-muted)}
.pace-box b{font-size:24px;color:var(--accent-green);margin-left:4px}

.actions{display:flex;justify-content:center;gap:10px;margin-top:16px}
.btn{border:0;border-radius:40px;padding:12px 28px;font-size:14px;font-weight:800;cursor:pointer;transition:transform 0.1s,opacity 0.2s}
.btn:active{transform:scale(0.96)}
.btn-start{background:var(--accent-green);color:#022c22;box-shadow:0 4px 15px var(--accent-glow)}
.btn-pause{background:#1e293b;color:#fff;display:none}
.btn-finish{background:var(--accent-danger);color:#fff;display:none}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:12px;text-align:center}
.card .label{font-size:10px;color:var(--text-muted);font-weight:800}
.card .val{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.card .unit{font-size:9px;color:var(--text-muted)}

.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:18px;padding:14px}
.panelhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:10px}

#map{height:320px;border-radius:18px;overflow:hidden;border:1px solid var(--card-border)}
.leaflet-tile{filter:brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7)}

.progress-bar{height:8px;background:#1e293b;border-radius:10px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;width:0%;background:var(--accent-green);transition:width 0.2s}

canvas#paceChart{width:100%;height:80px;display:block}

.history-item{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:11px}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .dist{font-size:56px}
  .time{font-size:40px}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">RUN<span>TRACK</span> <small style="font-size:10px;color:var(--text-muted)">PRO V6</small></div>
    <div class="gps-pill">
      <div id="gpsDot" class="dot"></div>
      <span id="gpsText">في انتظار الموقع</span>
    </div>
  </header>

  <section class="hero">
    <div id="state" class="state">جاهز للبدء</div>
    <div id="time" class="time">00:00:00</div>
    <div class="dist"><span id="distance">0.000</span><small>كم</small></div>
    <div class="pace-box">السرعة الحالية: <b id="currentPace">--:--</b> /كم</div>
    <div class="actions">
      <button id="startBtn" class="btn btn-start" onclick="startRun()">▶ بدء التمرين</button>
      <button id="pauseBtn" class="btn btn-pause" onclick="togglePause()">Ⅱ إيقاف مؤقت</button>
      <button id="finishBtn" class="btn btn-finish" onclick="finishRun()">■ إنهاء</button>
    </div>
  </section>

  <section class="grid">
    <div class="card"><div class="label">السرعة</div><div id="speed" class="val">0.0</div><div class="unit">كم/ساعة</div></div>
    <div class="card"><div class="label">معدل الوتيرة</div><div id="avgPace" class="val">--:--</div><div class="unit">دقيقة/كم</div></div>
    <div class="card"><div class="label">دقة الـ GPS</div><div id="accuracy" class="val">--</div><div class="unit">أمتار</div></div>
    <div class="card"><div class="label">الخطوات المقدرة</div><div id="steps" class="val">0</div><div class="unit">خطوة</div></div>
  </section>

  <div id="map"></div>

  <section class="panel">
    <div class="panelhead">
      <span>🎯 المقطع الحالي (400m)</span>
      <span id="remaining" style="color:var(--accent-green)">400m</span>
    </div>
    <div class="progress-bar"><div id="bar" class="progress-fill"></div></div>
  </section>

  <section class="panel">
    <div class="panelhead"><span>📊 المخطط اللحظي للوتيرة</span></div>
    <canvas id="paceChart"></canvas>
  </section>

  <section class="panel">
    <div class="panelhead"><span>🏆 السجل الأخير</span></div>
    <div id="history"><div style="color:var(--text-muted);font-size:12px;text-align:center">لا يوجد تمارين مسجلة بعد.</div></div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// --- خوارزمية مرشح كالمان لـ GPS ---
class KalmanFilter2D {
  constructor(processNoise = 3) {
    this.processNoise = processNoise;
    this.lat = null;
    this.lng = null;
    this.variance = -1;
  }
  process(lat, lng, accuracy, timestamp) {
    if (this.variance < 0) {
      this.lat = lat;
      this.lng = lng;
      this.variance = accuracy * accuracy;
      return { lat, lng };
    }
    this.variance += this.processNoise;
    const k = this.variance / (this.variance + accuracy * accuracy);
    this.lat += k * (lat - this.lat);
    this.lng += k * (lng - this.lng);
    this.variance = (1 - k) * this.variance;
    return { lat: this.lat, lng: this.lng };
  }
}

// --- الحالة العامة والتكوين ---
const kalman = new KalmanFilter2D(2);
let running = false, paused = false, watchId = null, timer = null;
let startTime = 0, pausedTotal = 0, pauseAt = 0;
let lastPoint = null, totalDistance = 0, residualDistance = 0, lapDist = 0;
let route = [], line = null, marker = null;
let paceHistory = [], stepCount = 0;

const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([31.7683, 35.2137], 16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// --- إدارة الحساسات والخطوات عند ضعف الـ GPS ---
if (window.DeviceMotionEvent) {
  window.addEventListener('devicemotion', (e) => {
    if (!running || paused) return;
    const acc = e.accelerationIncludingGravity;
    if (acc) {
      const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
      if (mag > 12.2) { stepCount++; document.getElementById('steps').innerText = stepCount; }
    }
  });
}

function startRun() {
  if (!navigator.geolocation) return alert('الـ GPS غير مدعوم في هذا الجهاز.');
  navigator.geolocation.getCurrentPosition(p => {
    resetRun();
    running = true;
    startTime = Date.now();
    watchId = navigator.geolocation.watchPosition(processGPS, gpsError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 10000
    });
    timer = setInterval(tick, 200);
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'inline-block';
    document.getElementById('finishBtn').style.display = 'inline-block';
    document.getElementById('state').innerText = 'جاري الجري...';
  }, gpsError, { enableHighAccuracy: true });
}

function processGPS(p) {
  if (!running || paused) return;
  const coords = p.coords;
  const rawLat = coords.latitude, rawLng = coords.longitude;
  const rawAcc = coords.accuracy || 30;
  const now = p.timestamp || Date.now();

  updateGPSUI(rawAcc);

  // تصفية الإحداثيات باستخدام كالمان
  const filtered = kalman.process(rawLat, rawLng, rawAcc, now);
  const lat = filtered.lat, lng = filtered.lng;

  if (!lastPoint) {
    lastPoint = { lat, lng, time: now };
    drawMap(lat, lng);
    return;
  }

  const dt = Math.max(0.5, (now - lastPoint.time) / 1000);
  const d = haversine(lastPoint.lat, lastPoint.lng, lat, lng);
  const speedKmh = (d / dt) * 3.6;

  // استبعاد النطزات غير المنطقية (أسرع من 45 كم/س)
  if (speedKmh > 45) return;

  // التراكم الدقيق للأمتار الممشية بدون إهمال الكسيرات الصغيرة
  residualDistance += d;
  if (residualDistance >= 0.5) { // تجميع الأمتار عند الوصول لـ 0.5 متر
    totalDistance += residualDistance;
    lapDist += residualDistance;
    residualDistance = 0;
  }

  lastPoint = { lat, lng, time: now };
  drawMap(lat, lng);
  updateMetrics(speedKmh);
}

function updateMetrics(speedKmh) {
  const km = totalDistance / 1000;
  const elapsed = getElapsedSec();

  document.getElementById('distance').innerText = km.toFixed(3);
  document.getElementById('speed').innerText = speedKmh.toFixed(1);

  if (km > 0.005) {
    const avgPaceSec = elapsed / km;
    document.getElementById('avgPace').innerText = formatPace(avgPaceSec);
  }

  if (speedKmh > 0.5) {
    const currentPaceSec = 3600 / speedKmh;
    document.getElementById('currentPace').innerText = formatPace(currentPaceSec);
    paceHistory.push(currentPaceSec);
    if (paceHistory.length > 30) paceHistory.shift();
    drawCanvasChart();
  } else {
    document.getElementById('currentPace').innerText = '--:--';
  }

  // تحديث شريط الـ 400 متر
  const currentLap = lapDist % 400;
  document.getElementById('bar').style.width = (currentLap / 400 * 100) + '%';
  document.getElementById('remaining').innerText = Math.round(400 - currentLap) + 'm';
}

function togglePause() {
  if (!running) return;
  if (!paused) {
    paused = true;
    pauseAt = Date.now();
    document.getElementById('pauseBtn').innerText = '▶ استئناف';
    document.getElementById('state').innerText = 'متوقف مؤقتاً';
  } else {
    paused = false;
    pausedTotal += (Date.now() - pauseAt);
    lastPoint = null;
    document.getElementById('pauseBtn').innerText = 'Ⅱ إيقاف مؤقت';
    document.getElementById('state').innerText = 'جاري الجري...';
  }
}

function finishRun() {
  if (!running) return;
  running = false;
  clearInterval(timer);
  if (watchId) navigator.geolocation.clearWatch(watchId);

  const elapsed = getElapsedSec();
  const km = totalDistance / 1000;
  const avgPace = km > 0 ? elapsed / km : 0;

  saveRun({ date: new Date().toLocaleDateString('ar-EG'), dist: km, time: elapsed, pace: avgPace });

  document.getElementById('state').innerText = 'اكتمل التمرين';
  document.getElementById('startBtn').style.display = 'inline-block';
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('finishBtn').style.display = 'none';
  loadHistory();
}

// --- رسم الخريطة البياني ---
function drawMap(lat, lng) {
  route.push([lat, lng]);
  if (!marker) {
    marker = L.circleMarker([lat, lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#10b981', fillOpacity: 1 }).addTo(map);
  } else {
    marker.setLatLng([lat, lng]);
  }
  if (!line) {
    line = L.polyline(route, { color: '#10b981', weight: 5, opacity: 0.8 }).addTo(map);
  } else {
    line.setLatLngs(route);
  }
  map.setView([lat, lng], 17, { animate: false });
}

function drawCanvasChart() {
  const canvas = document.getElementById('paceChart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (paceHistory.length < 2) return;
  const min = Math.min(...paceHistory), max = Math.max(...paceHistory);
  const range = (max - min) || 1;

  ctx.beginPath();
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 2;

  paceHistory.forEach((v, i) => {
    const x = (i / (paceHistory.length - 1)) * canvas.width;
    const y = canvas.height - ((v - min) / range) * (canvas.height - 10) - 5;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// --- العمليات الحسابية المساعدة ---
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function getElapsedSec() {
  const p = paused ? Date.now() - pauseAt : 0;
  return Math.max(0, (Date.now() - startTime - pausedTotal - p) / 1000);
}

function tick() {
  if (running && !paused) {
    const s = getElapsedSec();
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    document.getElementById('time').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }
}

function formatPace(s) {
  if (!Number.isFinite(s) || s <= 0 || s > 3600) return '--:--';
  return `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(Math.round(s % 60)).padStart(2,'0')}`;
}

function updateGPSUI(acc) {
  document.getElementById('accuracy').innerText = Math.round(acc);
  const dot = document.getElementById('gpsDot');
  const txt = document.getElementById('gpsText');
  if (acc <= 15) { dot.className = 'dot good'; txt.innerText = 'إشارة ممتازة'; }
  else if (acc <= 35) { dot.className = 'dot warn'; txt.innerText = 'إشارة متوسطة'; }
  else { dot.className = 'dot bad'; txt.innerText = 'إشارة ضعيفة'; }
}

function gpsError() { document.getElementById('gpsText').innerText = 'خطأ في الـ GPS'; }

function resetRun() {
  totalDistance = 0; residualDistance = 0; lapDist = 0; lastPoint = null; route = []; paceHistory = []; stepCount = 0;
  if (line) map.removeLayer(line); line = null;
  if (marker) map.removeLayer(marker); marker = null;
  document.getElementById('distance').innerText = '0.000';
  document.getElementById('speed').innerText = '0.0';
  document.getElementById('avgPace').innerText = '--:--';
  document.getElementById('currentPace').innerText = '--:--';
  document.getElementById('steps').innerText = '0';
}

function saveRun(r) {
  let h = JSON.parse(localStorage.getItem('runtrack_v6') || '[]');
  h.unshift(r); localStorage.setItem('runtrack_v6', JSON.stringify(h.slice(0, 10)));
}

function loadHistory() {
  let h = JSON.parse(localStorage.getItem('runtrack_v6') || '[]');
  if (!h.length) return;
  document.getElementById('history').innerHTML = h.map(x => `
    <div class="history-item">
      <div>${x.date}</div>
      <div>${x.dist.toFixed(3)} كم</div>
      <div>${formatPace(x.pace)} /كم</div>
    </div>`).join('');
}
loadHistory();
</script>
</body>
</html>
