<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#05070a;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

.app{
    max-width:1000px;
    margin:auto;
    padding:12px;
}

header{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo span{
    color:#46f39a;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    font-weight:800;
    color:#8d99a8;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#555;
}

.dot.good{
    background:#46f39a;
    box-shadow:0 0 12px #46f39a;
}

.dot.warn{
    background:#ffc857;
}

.dot.bad{
    background:#ff5261;
}

.dashboard{
    background:
        linear-gradient(145deg,#17202c,#0b1016);
    border:1px solid #263240;
    border-radius:28px;
    padding:25px 18px;
    text-align:center;
}

.state{
    color:#768394;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
}

.time{
    margin-top:10px;
    font-size:58px;
    font-weight:900;
    letter-spacing:-3px;
}

.distance{
    margin-top:8px;
    font-size:75px;
    line-height:1;
    font-weight:900;
    letter-spacing:-4px;
}

.distance small{
    font-size:16px;
    color:#778394;
    letter-spacing:0;
}

.mainpace{
    margin-top:12px;
    color:#9ca8b7;
    font-size:15px;
}

.mainpace strong{
    color:#46f39a;
    font-size:25px;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:22px;
    flex-wrap:wrap;
}

button{
    border:0;
    border-radius:50px;
    padding:15px 28px;
    font-weight:900;
    cursor:pointer;
}

.start{
    background:#46f39a;
    color:#06100a;
}

.pause{
    background:#27313d;
    color:#fff;
    display:none;
}

.stop{
    background:#ee5260;
    color:#fff;
    display:none;
}

.grid{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.card{
    background:#11171f;
    border:1px solid #202a35;
    border-radius:19px;
    padding:16px;
}

.label{
    color:#718092;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    font-weight:900;
}

.value{
    margin-top:7px;
    font-size:25px;
    font-weight:900;
}

.unit{
    margin-top:3px;
    color:#687586;
    font-size:9px;
}

#map{
    height:430px;
    margin-top:10px;
    border-radius:23px;
    overflow:hidden;
    border:1px solid #202a35;
}

.mapinfo{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.info{
    background:#11171f;
    border:1px solid #202a35;
    padding:14px;
    border-radius:16px;
    text-align:center;
}

.info b{
    display:block;
    font-size:17px;
}

.info span{
    color:#6f7b8b;
    font-size:9px;
}

.lapbox{
    margin-top:10px;
    background:#11171f;
    border:1px solid #202a35;
    border-radius:20px;
    padding:17px;
}

.laptop{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:12px;
    font-weight:900;
}

.progress{
    height:8px;
    background:#27303b;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0;
    background:#46f39a;
    transition:width .1s linear;
}

.laps{
    margin-top:10px;
    background:#11171f;
    border:1px solid #202a35;
    border-radius:20px;
    padding:17px;
}

.lap{
    display:grid;
    grid-template-columns:35px 1fr 1fr 1fr;
    padding:12px 0;
    border-bottom:1px solid #202832;
    font-size:11px;
}

.lap:last-child{
    border-bottom:0;
}

.green{
    color:#46f39a;
}

.center{
    text-align:center;
}

.right{
    text-align:right;
}

.history{
    margin-top:10px;
    background:#11171f;
    border:1px solid #202a35;
    border-radius:20px;
    padding:17px;
}

.history button{
    margin-top:10px;
    padding:10px 16px;
    background:#202a35;
    color:white;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .mapinfo{
        grid-template-columns:repeat(3,1fr);
    }

    .time{
        font-size:46px;
    }

    .distance{
        font-size:64px;
    }

    #map{
        height:390px;
    }
}

<body>

<div class="app">

<header>
    <div class="logo">
        RUN<span>TRACK</span>
    </div>

    <div class="status">
        <div class="dot" id="gpsDot"></div>
        <span id="gpsText">GPS OFF</span>

</header>

    <div class="state" id="state">

    <div class="time" id="time">

        </button>

        id="pause"

        </button>

        id="stop"

        </button>

    <div class="card">

        <div class="unit">KM/H</div>

        <div class="label">100m Pace</div>
        <div class="value" id="pace100">--:--</div>
        <div class="unit">MIN/100M</div>
    </div>

    <div class="card">
        <div class="label">GPS Accuracy</div>
        <div class="value" id="accuracy">--</div>
        <div class="unit">METERS</div>
    </div>

    <div class="card">
        <div class="label">Altitude</div>
        <div class="value" id="altitude">--</div>
        <div class="unit">METERS</div>
    </div>

    <div class="card">
        <div class="label">Heading</div>
        <div class="value" id="heading">--</div>
        <div class="unit">DEGREES</div>
    </div>

</section>


<div id="map"></div>


<div class="mapinfo">

    <div class="info">
        <b id="lat">--</b>
        <span>LATITUDE</span>

    <div class="info">

    </div>

</div>

            400m
        </span>
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

</section>


<section class="laps">

    <div style="font-weight:900">
        LAPS
    </div>

    <div id="lapList">
        <div style="color:#697586;margin-top:12px">
            No laps yet
        </div>
    </div>

</section>


<section class="history">

    <div style="font-weight:900">
        LAST RUN
    </div>

    <div id="history">
        No saved run
    </div>

    <button onclick="clearHistory()">
        CLEAR HISTORY
    </button>

</section>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   RUNTRACK PRO GPS ENGINE
========================================================= */

const CONFIG = {

    LAP:400,

    /*
       Do not accept GPS with extremely
       poor accuracy.
    */
    MAX_ACCURACY:65,

    /*
       Only reject physically impossible
       GPS jumps.
    */
    MAX_SPEED:55,

    /*
       Very small movement is normally
       GPS noise.
    */
    MIN_MOVEMENT:1.2,

    /*
       Smoothing window.
    */
    SPEED_WINDOW:5

};


/* =========================================================
   STATE
========================================================= */

let running=false;
let paused=false;

let watchId=null;

let startTime=0;

let pausedDuration=0;
let pauseStarted=0;

let lastPosition=null;

let totalDistance=0;

let lapDistance=0;

let lapStart=0;

let laps=[];

let speedHistory=[];

let route=[];

let marker=null;
let line=null;

let timer=null;


/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{
    zoomControl:false
}).setView(
    [31.7683,35.2137],
    17
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:20,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


/* =========================================================
   START
========================================================= */

function startRun(){

    if(!navigator.geolocation){

        alert("This browser does not support GPS.");

        return;
    }

    /*
       Ask for a REAL GPS fix first.
    */

    setGPS(
        "SEARCHING",
        "warn"
    );

    navigator.geolocation.getCurrentPosition(

        position=>{

            reset();

            running=true;
            paused=false;

            startTime=Date.now();
            lapStart=startTime;

            processPosition(position);

            watchId=
                navigator.geolocation.watchPosition(
                    processPosition,
                    gpsError,
                    {
                        enableHighAccuracy:true,
                        maximumAge:0,
                        timeout:10000
                    }
                );

            timer=setInterval(
                updateTimer,
                200
            );

            document.getElementById("start")
                .style.display="none";

            document.getElementById("pause")
                .style.display="inline-block";

            document.getElementById("stop")
                .style.display="inline-block";

            document.getElementById("state")
                .innerText="RUNNING";

        },

        gpsError,

        {
            enableHighAccuracy:true,
            maximumAge:0,
            timeout:20000
        }
    );
}


/* =========================================================
   PROCESS GPS
========================================================= */

function processPosition(position){

    if(!running || paused)
        return;

    const c=position.coords;

    const lat=c.latitude;
    const lon=c.longitude;

    const accuracy=
        Number.isFinite(c.accuracy)
        ? c.accuracy
        : 999;

    document.getElementById("accuracy")
        .innerText=
        Math.round(accuracy);

    document.getElementById("altitude")
        .innerText=
        Number.isFinite(c.altitude)
        ? Math.round(c.altitude)
        : "--";

    document.getElementById("heading")
        .innerText=
        Number.isFinite(c.heading)
        ? Math.round(c.heading)+"°"
        : "--";

    document.getElementById("lat")
        .innerText=
        lat.toFixed(6);

    document.getElementById("lon")
        .innerText=
        lon.toFixed(6);

    document.getElementById("gpsAge")
        .innerText="0s";


    /*
       First GPS point.
    */

    if(!lastPosition){

        lastPosition={
            lat,
            lon,
            time:position.timestamp
        };

        draw(
            lat,
            lon
        );

        setGPS(
            "GPS LOCK",
            accuracy<25
                ?"good"
                :"warn"
        );

        return;
    }


    const distance=
        haversine(
            lastPosition.lat,
            lastPosition.lon,
            lat,
            lon
        );


    const dt=
        Math.max(
            .25,
            (
                position.timestamp -
                lastPosition.time
            )/1000
        );


    /*
       Calculate actual movement speed.
    */

    const calculatedSpeed=
        distance/dt*3.6;


    /*
       If the phone itself provides
       speed, prefer it.

       This is normally better than
       calculating speed from two
       noisy GPS points.
    */

    let speed;

    if(
        Number.isFinite(c.speed) &&
        c.speed>=0
    ){

        speed=c.speed*3.6;

    }else{

        speed=calculatedSpeed;

    }


    /*
       Ignore impossible GPS jumps.

       NOTICE:
       This is NOT a 30m limit.

       100m over 15 seconds is valid.

       100m over 1 second is not.
    */

    if(
        speed>CONFIG.MAX_SPEED
    ){

        return;
    }


    /*
       Poor accuracy:

       Don't add distance from this
       particular point.

       But keep UI alive.
    */

    if(
        accuracy>CONFIG.MAX_ACCURACY
    ){

        lastPosition.time=
            position.timestamp;

        setGPS(
            "WEAK GPS",
            "warn"
        );

        return;
    }


    /*
       Small movement = GPS noise.

       But update the reference time.
    */

    if(
        distance<CONFIG.MIN_MOVEMENT
    ){

        lastPosition.time=
            position.timestamp;

        updateSpeed(
            speed
        );

        updateDisplay();

        return;
    }


    /*
       ACCEPT MOVEMENT
    */

    totalDistance+=distance;

    lapDistance+=distance;


    lastPosition={
        lat,
        lon,
        time:position.timestamp
    };


    updateSpeed(speed);

    draw(lat,lon);

    updateDisplay();


    /*
       Handle one or multiple laps.
    */

    while(
        lapDistance>=CONFIG.LAP
    ){

        finishLap();

    }

}


/* =========================================================
   SPEED SMOOTHING
========================================================= */

function updateSpeed(speed){

    if(
        !Number.isFinite(speed) ||
        speed<0 ||
        speed>CONFIG.MAX_SPEED
    )
        return;


    speedHistory.push(speed);

    if(
        speedHistory.length>
        CONFIG.SPEED_WINDOW
    ){

        speedHistory.shift();

    }
}


function smoothSpeed(){

    if(!speedHistory.length)
        return 0;

    /*
       Median filter.

       Much more realistic for GPS
       than displaying every raw value.
    */

    const a=
        [...speedHistory]
        .sort((x,y)=>x-y);

    return a[
        Math.floor(a.length/2)
    ];
}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay(){

    const km=
        totalDistance/1000;

    document.getElementById("distance")
        .innerText=
        km.toFixed(3);


    const elapsed=
        elapsedSeconds();


    /*
       Average pace
    */

    if(km>0){

        const pace=
            elapsed/km;

        document.getElementById("avgPace")
            .innerText=
            paceFormat(pace);

    }


    /*
       Current speed
    */

    const speed=
        smoothSpeed();


    if(speed>0){

        document.getElementById("speed")
            .innerText=
            speed.toFixed(1);


        /*
           Pace = seconds per km.

           3600 / km/h.
        */

        const pace=
            3600/speed;


        document.getElementById("currentPace")
            .innerText=
            paceFormat(pace);


        /*
           100 meter pace.

           seconds per 100m.
        */

        const p100=
            360/speed;


        document.getElementById("pace100")
            .innerText=
            paceFormat(p100);

    }


    /*
       Lap progress
    */

    const percent=
        Math.min(
            100,
            lapDistance/
            CONFIG.LAP*
            100
        );

    document.getElementById("bar")
        .style.width=
        percent+"%";


    document.getElementById("remaining")
        .innerText=
        Math.max(
            0,
            Math.round(
                CONFIG.LAP-
                lapDistance
            )
        )+"m";

}


/* =========================================================
   TIMER
========================================================= */

function updateTimer(){

    if(!running)
        return;

    const elapsed=
        elapsedSeconds();

    document.getElementById("time")
        .innerText=
        timeFormat(elapsed);

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!running)
        return;

    if(!paused){

        paused=true;

        pauseStarted=Date.now();

        document.getElementById("pause")
            .innerText="▶ RESUME";

        document.getElementById("state")
            .innerText="PAUSED";

        setGPS(
            "PAUSED",
            "warn"
        );

    }else{

        paused=false;

        pausedDuration+=
            Date.now()-
            pauseStarted;

        pauseStarted=0;

        /*
           VERY IMPORTANT:

           Do not count the distance
           between pause and resume.
        */

        lastPosition=null;

        speedHistory=[];

        document.getElementById("pause")
            .innerText="❚❚ PAUSE";

        document.getElementById("state")
            .innerText="RUNNING";

        setGPS(
            "GPS LOCK",
            "good"
        );

    }

}


/* =========================================================
   FINISH LAP
========================================================= */

function finishLap(){

    const now=Date.now();

    const lapTime=
        (now-lapStart)/1000;

    const pace=
        lapTime/.4;

    const speed=
        1440/lapTime;


    laps.push({

        number:laps.length+1,
        time:lapTime,
        pace,
        speed

    });


    lapDistance-=CONFIG.LAP;

    lapStart=now;

    renderLap(
        laps[laps.length-1]
    );


    if(
        navigator.vibrate
    ){

        navigator.vibrate([
            120,
            80,
            120
        ]);

    }


    if(
        "speechSynthesis"
        in window
    ){

        speechSynthesis.cancel();

        const msg=
            new SpeechSynthesisUtterance(
                "400 meters completed"
            );

        msg.rate=1.15;

        speechSynthesis.speak(msg);

    }

}


/* =========================================================
   LAP UI
========================================================= */

function renderLap(lap){

    const list=
        document.getElementById(
            "lapList"
        );


    if(
        list.innerText===
        "No laps yet"
    ){

        list.innerHTML="";

    }


    const div=
        document.createElement("div");

    div.className="lap";

    div.innerHTML=`

        <div class="green">
            #${lap.number}
        </div>

        <div class="center">
            ${shortTime(lap.time)}
        </div>

        <div class="center">
            ${paceFormat(lap.pace)}
        </div>

        <div class="right">
            ${lap.speed.toFixed(1)}
        </div>

    `;

    list.prepend(div);

}


/* =========================================================
   FINISH RUN
========================================================= */

function finishRun(){

    if(!running)
        return;


    running=false;


    clearInterval(timer);


    if(watchId!==null){

        navigator.geolocation
            .clearWatch(watchId);

        watchId=null;

    }


    const elapsed=
        elapsedSeconds();


    const km=
        totalDistance/1000;


    const avgSpeed=
        elapsed>0
        ?km/(elapsed/3600)
        :0;


    const avgPace=
        km>0
        ?elapsed/km
        :0;


    saveRun(
        km,
        elapsed,
        avgPace,
        avgSpeed
    );


    document.getElementById("state")
        .innerText="FINISHED";

    document.getElementById("start")
        .style.display="inline-block";

    document.getElementById("pause")
        .style.display="none";

    document.getElementById("stop")
        .style.display="none";

    setGPS(
        "GPS OFF",
        ""
    );


    showHistory();


    alert(
        "RUN COMPLETE\n\n"+
        km.toFixed(3)+" km\n"+
        timeFormat(elapsed)+"\n"+
        "Pace "+paceFormat(avgPace)
    );

}


/* =========================================================
   ELAPSED
========================================================= */

function elapsedSeconds(){

    if(!startTime)
        return 0;


    let pausedNow=0;

    if(
        paused &&
        pauseStarted
    ){

        pausedNow=
            Date.now()-
            pauseStarted;

    }


    return(
        Date.now()-
        startTime-
        pausedDuration-
        pausedNow
    )/1000;

}


/* =========================================================
   MAP
========================================================= */

function draw(lat,lon){

    route.push([
        lat,
        lon
    ]);


    if(!marker){

        marker=
            L.circleMarker(
                [lat,lon],
                {
                    radius:8,
                    color:"#fff",
                    weight:3,
                    fillColor:"#46f39a",
                    fillOpacity:1
                }
            ).addTo(map);

    }else{

        marker.setLatLng([
            lat,
            lon
        ]);

    }


    if(!line){

        line=
            L.polyline(
                route,
                {
                    color:"#46f39a",
                    weight:5,
                    opacity:.9
                }
            ).addTo(map);

    }else{

        line.setLatLngs(route);

    }


    map.setView(
        [lat,lon],
        18,
        {
            animate:false
        }
    );

}


/* =========================================================
   GPS STATUS
========================================================= */

function setGPS(text,type){

    document.getElementById(
        "gpsText"
    ).innerText=text;

    document.getElementById(
        "gpsDot"
    ).className=
        "dot "+
        (
            type==="good"
            ?"good"
            :
            type==="warn"
            ?"warn"
            :
            type==="bad"
            ?"bad"
            :""
        );

}


/* =========================================================
   GPS ERROR
========================================================= */

function gpsError(error){

    if(
        error.code===1
    ){

        alert(
            "Location permission was denied.\n\n"+
            "Please allow location access."
        );

        running=false;

        return;
    }


    setGPS(
        "GPS SEARCHING",
        "warn"
    );

}


/* =========================================================
   HAVERSINE
========================================================= */

function haversine(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const dLat=
        (lat2-lat1)*
        Math.PI/180;

    const dLon=
        (lon2-lon1)*
        Math.PI/180;


    const a=
        Math.sin(dLat/2)**2+
        Math.cos(
            lat1*Math.PI/180
        )*
        Math.cos(
            lat2*Math.PI/180
        )*
        Math.sin(dLon/2)**2;


    return(
        2*R*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        )
    );

}


/* =========================================================
   FORMATTING
========================================================= */

function timeFormat(sec){

    sec=Math.max(
        0,
        Math.round(sec)
    );

    const h=
        Math.floor(sec/3600);

    const m=
        Math.floor(
            (sec%3600)/60
        );

    const s=
        sec%60;

    return(
        String(h).padStart(2,"0")+
        ":"+
        String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0")
    );

}


function shortTime(sec){

    sec=Math.round(sec);

    const m=
        Math.floor(sec/60);

    const s=
        sec%60;

    return(
        String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0")
    );

}


function paceFormat(sec){

    if(
        !Number.isFinite(sec) ||
        sec<=0 ||
        sec>3600
    )
        return"--:--";


    const m=
        Math.floor(sec/60);

    const s=
        Math.round(sec%60);

    return(
        String(m).padStart(2,"0")+
        ":"+
        String(s).padStart(2,"0")
    );

}


/* =========================================================
   RESET
========================================================= */

function reset(){

    totalDistance=0;

    lapDistance=0;

    laps=[];

    route=[];

    lastPosition=null;

    speedHistory=[];

    pausedDuration=0;

    pauseStarted=0;

    if(line){

        map.removeLayer(line);

        line=null;

    }

    if(marker){

        map.removeLayer(marker);

        marker=null;

    }


    document.getElementById("distance")
        .innerText="0.000";

    document.getElementById("time")
        .innerText="00:00:00";

    document.getElementById("speed")
        .innerText="0.0";

    document.getElementById("currentPace")
        .innerText="--:--";

    document.getElementById("avgPace")
        .innerText="--:--";

    document.getElementById("pace100")
        .innerText="--:--";

    document.getElementById("bar")
        .style.width="0";

    document.getElementById("remaining")
        .innerText="400m";

    document.getElementById("lapList")
        .innerHTML=
        "<div style='color:#697586;margin-top:12px'>No laps yet</div>";

}


/* =========================================================
   HISTORY
========================================================= */

function saveRun(
    distance,
    time,
    pace,
    speed
){

    const data={

        date:new Date().toLocaleString(),

        distance,

        time,

        pace,

        speed

    };


    localStorage.setItem(
        "runtrack_last",
        JSON.stringify(data)
    );

}


function showHistory(){

    const raw=
        localStorage.getItem(
            "runtrack_last"
        );

    if(!raw)
        return;

    const r=
        JSON.parse(raw);


    document.getElementById(
        "history"
    ).innerHTML=`

        <div style="margin-top:12px;color:#8c98a8">
            ${r.date}
        </div>

        <div style="
            margin-top:12px;
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:8px;
        ">

            <div>
                <b>${r.distance.toFixed(3)} km</b>
                <small style="display:block;color:#697586">
                    DISTANCE
                </small>
            </div>

            <div>
                <b>${timeFormat(r.time)}</b>
                <small style="display:block;color:#697586">
                    TIME
                </small>
            </div>

            <div>
                <b>${paceFormat(r.pace)}</b>
                <small style="display:block;color:#697586">
                    PACE
                </small>
            </div>

            <div>
                <b>${r.speed.toFixed(1)} km/h</b>
                <small style="display:block;color:#697586">
                    SPEED
                </small>
            </div>

        </div>

    `;

}


function clearHistory(){

    localStorage.removeItem(
        "runtrack_last"
    );

    document.getElementById(
        "history"
    ).innerText=
        "No saved run";

}


showHistory();

</script>
