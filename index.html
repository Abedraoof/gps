<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RunTrack GPS</title>


<!-- Leaflet Map -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #080b10;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


.container {

    width: 100%;

    max-width: 900px;

    margin: auto;

    padding: 20px;
}


/* HEADER */

header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}


.logo {

    font-size: 25px;

    font-weight: 700;
}


.status {

    color: #55e88b;

    font-size: 14px;
}


/* TIMER */

.timer-card {

    background: #131821;

    border-radius: 22px;

    padding: 25px;

    text-align: center;

    margin-bottom: 15px;
}


.timer {

    font-size: 55px;

    font-weight: 700;

    margin-bottom: 15px;
}


/* BUTTONS */

button {

    border: none;

    border-radius: 50px;

    padding: 15px 45px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}


.start {

    background: #55e88b;

    color: #061009;
}


.stop {

    background: #ff4d4d;

    color: white;

    display: none;
}


/* STATS */

.stats {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;

    margin-bottom: 15px;
}


.card {

    background: #131821;

    border-radius: 18px;

    padding: 20px;
}


.label {

    color: #8993a3;

    font-size: 13px;

    margin-bottom: 10px;
}


.value {

    font-size: 29px;

    font-weight: bold;
}


.unit {

    color: #8993a3;

    font-size: 13px;

    margin-top: 4px;
}


/* MAP */

#map {

    width: 100%;

    height: 430px;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 15px;
}


/* SUMMARY */

.summary {

    display: none;

    background: #131821;

    border-radius: 20px;

    padding: 22px;

    margin-top: 15px;
}


.summary h2 {

    margin-top: 0;
}


.summary-row {

    display: flex;

    justify-content: space-between;

    padding: 12px 0;

    border-bottom:
        1px solid #242b36;
}


.summary-row:last-child {

    border-bottom: none;
}


/* MOBILE */

@media(max-width: 600px) {

    .container {

        padding: 12px;
    }


    .timer {

        font-size: 45px;
    }


    .value {

        font-size: 24px;
    }


    #map {

        height: 350px;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

<div class="logo">

🏃 RunTrack

</div>


<div
    class="status"
    id="status"
>

Ready

</div>

</header>



<!-- TIMER -->

<div class="timer-card">


<div
    class="timer"
    id="timer"
>

00:00:00

</div>


<button
    class="start"
    id="startButton"
    onclick="startRun()"
>

▶ START

</button>


<button
    class="stop"
    id="stopButton"
    onclick="stopRun()"
>

■ STOP

</button>


</div>



<!-- STATS -->

<div class="stats">


<div class="card">

<div class="label">

DISTANCE

</div>


<div
    class="value"
    id="distance"
>

0.00

</div>


<div class="unit">

km

</div>

</div>



<div class="card">

<div class="label">

CURRENT SPEED

</div>


<div
    class="value"
    id="speed"
>

0.0

</div>


<div class="unit">

km/h

</div>

</div>



<div class="card">

<div class="label">

PACE / 100m

</div>


<div
    class="value"
    id="pace100"
>

--:--

</div>


<div class="unit">

min / 100m

</div>

</div>



<div class="card">

<div class="label">

AVG PACE

</div>


<div
    class="value"
    id="avgPace"
>

--:--

</div>


<div class="unit">

min / km

</div>

</div>



<div class="card">

<div class="label">

GPS ACCURACY

</div>


<div
    class="value"
    id="accuracy"
>

--

</div>


<div class="unit">

meters

</div>

</div>



<div class="card">

<div class="label">

GPS STATUS

</div>


<div
    class="value"
    id="gpsStatus"
>

OFF

</div>

</div>


</div>



<!-- MAP -->

<div id="map"></div>



<!-- SUMMARY -->

<div
    class="summary"
    id="summary"
>

<h2>

🏁 Run Complete

</h2>


<div class="summary-row">

<span>Distance</span>

<strong id="finalDistance">

0.00 km

</strong>

</div>


<div class="summary-row">

<span>Time</span>

<strong id="finalTime">

00:00:00

</strong>

</div>


<div class="summary-row">

<span>Average Speed</span>

<strong id="finalSpeed">

0.0 km/h

</strong>

</div>


<div class="summary-row">

<span>Average Pace</span>

<strong id="finalPace">

--:--

</strong>

</div>


<div class="summary-row">

<span>100m Pace</span>

<strong id="final100">

--:--

</strong>

</div>


</div>


</div>



<!-- Leaflet -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


/* ==========================================
   VARIABLES
========================================== */


let map;

let marker;

let routeLine;

let watchID = null;

let timerID = null;

let running = false;

let startTime = null;

let lastPosition = null;

let totalDistance = 0;

let route = [];



/* ==========================================
   MAP INITIALIZATION
========================================== */


map = L.map("map").setView(
    [31.7683, 35.2137],
    13
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);



/* ==========================================
   START RUN
========================================== */


function startRun() {


    if (!navigator.geolocation) {

        alert(
            "Your browser does not support GPS."
        );

        return;
    }


    /*
        Request GPS permission.
    */

    navigator.geolocation.getCurrentPosition(

        function(position) {

            beginTracking(position);

        },

        function(error) {

            handleGPSError(error);

        },

        {
            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0
        }

    );

}



/* ==========================================
   BEGIN TRACKING
========================================== */


function beginTracking(position) {


    running = true;

    startTime = Date.now();

    totalDistance = 0;

    lastPosition = null;

    route = [];


    /*
        Reset UI
    */

    document.getElementById(
        "distance"
    ).innerText = "0.00";


    document.getElementById(
        "speed"
    ).innerText = "0.0";


    document.getElementById(
        "pace100"
    ).innerText = "--:--";


    document.getElementById(
        "avgPace"
    ).innerText = "--:--";


    document.getElementById(
        "summary"
    ).style.display = "none";


    document.getElementById(
        "startButton"
    ).style.display = "none";


    document.getElementById(
        "stopButton"
    ).style.display = "inline-block";


    document.getElementById(
        "status"
    ).innerText = "Running";


    document.getElementById(
        "gpsStatus"
    ).innerText = "ACTIVE";


    /*
        Start timer
    */

    timerID = setInterval(
        updateTimer,
        1000
    );


    /*
        Add first GPS point
    */

    updatePosition(position);


    /*
        Start continuous GPS tracking
    */

    watchID =
        navigator.geolocation.watchPosition(

            updatePosition,

            handleGPSError,

            {

                enableHighAccuracy: true,

                maximumAge: 0,

                timeout: 10000

            }

        );

}



/* ==========================================
   GPS POSITION UPDATE
========================================== */


function updatePosition(position) {


    if (!running)
        return;


    const lat =
        position.coords.latitude;


    const lon =
        position.coords.longitude;


    const accuracy =
        position.coords.accuracy;


    /*
        GPS accuracy
    */

    document.getElementById(
        "accuracy"
    ).innerText =
        Math.round(accuracy);


    /*
        Ignore very inaccurate GPS points
    */

    if (accuracy > 50)
        return;


    /*
        Calculate distance
    */

    if (lastPosition !== null) {


        const distance =
            calculateDistance(

                lastPosition.lat,

                lastPosition.lon,

                lat,

                lon

            );


        /*
            Ignore GPS noise.

            3 meters is useful
            for running tracking.
        */

        if (distance >= 3) {

            totalDistance += distance;

        }

    }


    /*
        Save position
    */

    lastPosition = {

        lat: lat,

        lon: lon

    };


    /*
        Add point to route
    */

    route.push([lat, lon]);


    /*
        Update marker
    */

    if (marker === undefined) {


        marker =
            L.marker([lat, lon])
            .addTo(map);


    } else {


        marker.setLatLng([
            lat,
            lon
        ]);

    }


    /*
        Move map
        to current position
    */

    map.setView(
        [lat, lon],
        18
    );


    /*
        Draw route
    */

    if (routeLine) {

        routeLine.setLatLngs(
            route
        );

    } else {

        routeLine =
            L.polyline(

                route,

                {
                    weight: 5
                }

            ).addTo(map);

    }


    /*
        Distance
    */

    const distanceKm =
        totalDistance / 1000;


    document.getElementById(
        "distance"
    ).innerText =
        distanceKm.toFixed(2);


    /*
        Speed
    */

    let speed =
        position.coords.speed;


    if (
        speed !== null &&
        speed >= 0
    ) {

        speed =
            speed * 3.6;

    } else {

        speed =
            calculateAverageSpeed();

    }


    document.getElementById(
        "speed"
    ).innerText =
        speed.toFixed(1);


    /*
        Pace per 100m
    */

    if (speed > 0) {


        const seconds100 =
            360 / speed;


        document.getElementById(
            "pace100"
        ).innerText =
            formatPace(seconds100);

    }


    /*
        Average Pace
    */

    updateAveragePace();

}



/* ==========================================
   DISTANCE
   HAVERSINE FORMULA
========================================== */


function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const R = 6371000;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(dLat / 2) ** 2

        +

        Math.cos(
            toRadians(lat1)
        )

        *

        Math.cos(
            toRadians(lat2)
        )

        *

        Math.sin(dLon / 2) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}



function toRadians(value) {

    return value *
        Math.PI /
        180;

}



/* ==========================================
   TIMER
========================================== */


function updateTimer() {


    if (!running)
        return;


    const seconds =
        (Date.now() - startTime)
        / 1000;


    document.getElementById(
        "timer"
    ).innerText =
        formatTime(seconds);

}



/* ==========================================
   AVERAGE SPEED
========================================== */


function calculateAverageSpeed() {


    if (startTime === null)
        return 0;


    const elapsed =
        (Date.now() - startTime)
        / 3600000;


    const distanceKm =
        totalDistance / 1000;


    if (elapsed <= 0)
        return 0;


    return distanceKm / elapsed;

}



/* ==========================================
   AVERAGE PACE
========================================== */


function updateAveragePace() {


    const distanceKm =
        totalDistance / 1000;


    if (distanceKm <= 0)
        return;


    const elapsed =
        (Date.now() - startTime)
        / 1000;


    const secondsPerKm =
        elapsed / distanceKm;


    document.getElementById(
        "avgPace"
    ).innerText =
        formatPace(secondsPerKm);

}



/* ==========================================
   STOP
========================================== */


function stopRun() {


    if (!running)
        return;


    running = false;


    /*
        Stop GPS
    */

    if (watchID !== null) {

        navigator.geolocation
            .clearWatch(
                watchID
            );

        watchID = null;

    }


    /*
        Stop timer
    */

    clearInterval(
        timerID
    );


    const elapsed =
        (Date.now() - startTime)
        / 1000;


    const distanceKm =
        totalDistance / 1000;


    /*
        Average speed
    */

    let averageSpeed = 0;


    if (elapsed > 0) {

        averageSpeed =
            distanceKm /
            (elapsed / 3600);

    }


    /*
        Average pace
    */

    let averagePace =
        "--:--";


    if (distanceKm > 0) {

        averagePace =
            formatPace(
                elapsed / distanceKm
            );

    }


    /*
        Last 100m pace
    */

    let pace100 =
        "--:--";


    if (averageSpeed > 0) {

        pace100 =
            formatPace(
                360 /
                averageSpeed
            );

    }


    /*
        Summary
    */

    document.getElementById(
        "finalDistance"
    ).innerText =
        distanceKm.toFixed(2)
        + " km";


    document.getElementById(
        "finalTime"
    ).innerText =
        formatTime(elapsed);


    document.getElementById(
        "finalSpeed"
    ).innerText =
        averageSpeed.toFixed(1)
        + " km/h";


    document.getElementById(
        "finalPace"
    ).innerText =
        averagePace;


    document.getElementById(
        "final100"
    ).innerText =
        pace100;


    document.getElementById(
        "summary"
    ).style.display =
        "block";


    /*
        UI
    */

    document.getElementById(
        "startButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "stopButton"
    ).style.display =
        "none";


    document.getElementById(
        "status"
    ).innerText =
        "Finished";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "OFF";

}



/* ==========================================
   TIME FORMAT
========================================== */


function formatTime(seconds) {


    seconds =
        Math.max(
            0,
            Math.round(seconds)
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    return (

        String(hours)
            .padStart(2, "0")

        +

        ":" +

        String(minutes)
            .padStart(2, "0")

        +

        ":" +

        String(secs)
            .padStart(2, "0")

    );

}



/* ==========================================
   PACE FORMAT
========================================== */


function formatPace(seconds) {


    if (
        !isFinite(seconds) ||
        seconds <= 0
    ) {

        return "--:--";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.round(
            seconds % 60
        );


    return (

        String(minutes)
            .padStart(2, "0")

        +

        ":" +

        String(secs)
            .padStart(2, "0")

    );

}



/* ==========================================
   GPS ERROR
========================================== */


function handleGPSError(error) {


    document.getElementById(
        "status"
    ).innerText =
        "GPS Error";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "ERROR";


    if (error.code === 1) {

        alert(
            "Location permission was denied. " +
            "Please allow location access in your browser settings."
        );

    }

    else if (error.code === 2) {

        alert(
            "Your location could not be determined."
        );

    }

    else if (error.code === 3) {

        alert(
            "GPS request timed out."
        );

    }

}


</script>

</body>

</html>
